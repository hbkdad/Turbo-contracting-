<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Turbo Contracting and Mining Services</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
      .tc-404-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        text-align: center;
      }
      .tc-404-inner { max-width: 520px; width: 100%; }
      .tc-404-code {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(6rem, 20vw, 10rem);
        line-height: 1;
        color: var(--amber);
        margin-bottom: 8px;
      }
      .tc-404-title {
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 800;
        margin-bottom: 16px;
      }
      .tc-404-msg {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
        margin-bottom: 40px;
      }
      .tc-404-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .tc-404-links a {
        padding: 12px 24px;
        border: 2px solid var(--amber);
        color: var(--amber);
        text-decoration: none;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: background 0.2s, color 0.2s;
        border-radius: 3px;
      }
      .tc-404-links a:hover,
      .tc-404-links a:focus-visible {
        background: var(--amber);
        color: var(--ink);
        outline: none;
      }
      .tc-404-links a.primary {
        background: var(--amber);
        color: var(--ink);
      }
      .tc-404-links a.primary:hover,
      .tc-404-links a.primary:focus-visible {
        background: transparent;
        color: var(--amber);
      }
      .tc-404-logo {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--amber);
        margin-bottom: 48px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="tc-404-wrap">
      <div class="tc-404-inner">
        <span class="tc-404-logo">Turbo Contracting &amp; Mining Services</span>
        <div class="tc-404-code">404</div>
        <h1 class="tc-404-title">Page Not Found</h1>
        <p class="tc-404-msg">That page doesn't exist or has moved. Use the links below to find what you're looking for.</p>
        <nav class="tc-404-links" aria-label="Main pages">
          <a href="/" class="primary">Home</a>
          <a href="/services.html">Services</a>
          <a href="/about.html">About</a>
          <a href="/contact.html">Get a Quote</a>
          <a href="/careers.html">Careers</a>
        </nav>
      </div>
    </div>
  </body>
</html>
